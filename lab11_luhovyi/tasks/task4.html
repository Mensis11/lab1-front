<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Завдання 4</title>
</head>
<body>
    <fieldset>
        <legend>Псевдокласи :valid, :invalid, :enabled</legend>
        <label>Валідація:</label>
        <input type="email" required placeholder="test@mail.com">
        
        <br><br>
        <label>:enabled :</label>
        <input type="text" value="Активне">
        
        <br><br>
        <label>:disabled :</label>
        <input type="text" disabled value="Неактивне">
    </fieldset>

    <h3>Псевдоклас :nth-last-of-type(n)</h3>
    <p>Абзац 1</p>
    <p>Абзац 2</p>
    <p>Абзац 3</p>

    <h3>Псевдоклас :target</h3>
    <a href="#section-target">Перейти до цілі</a>
    <div style="height: 400px;"></div>
    <div id="section-target">
        Lorem Ipsum is simply dummy text of the printing and typesetting industry.
    </div>
</body>
</html>
